<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seletor de Capas</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #111; color: #fff; padding: 20px; }
  h1 { margin-bottom: 20px; font-size: 24px; }
  .product { margin-bottom: 40px; border: 1px solid #333; border-radius: 12px; padding: 16px; background: #1a1a1a; }
  .product-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .product-header h2 { font-size: 18px; font-weight: 600; }
  .product-header .code { color: #888; font-size: 14px; }
  .images { display: flex; flex-wrap: wrap; gap: 10px; }
  .img-card { position: relative; cursor: pointer; border: 3px solid transparent; border-radius: 8px; overflow: hidden; transition: all 0.2s; }
  .img-card:hover { border-color: #666; transform: scale(1.02); }
  .img-card.selected { border-color: #22c55e; }
  .img-card.selected::after {
    content: '★ CAPA';
    position: absolute; top: 6px; left: 6px;
    background: #22c55e; color: #000; font-weight: 700; font-size: 11px;
    padding: 3px 8px; border-radius: 4px;
  }
  .img-card img { display: block; width: 200px; height: 200px; object-fit: cover; }
  .save-btn {
    position: fixed; bottom: 20px; right: 20px; z-index: 100;
    padding: 14px 28px; background: #22c55e; color: #000; font-weight: 700;
    font-size: 16px; border: none; border-radius: 10px; cursor: pointer;
    box-shadow: 0 4px 20px rgba(34,197,94,0.4);
  }
  .save-btn:hover { background: #16a34a; }
  .output-area { margin-top: 30px; background: #0a0a0a; border: 1px solid #333; border-radius: 8px; padding: 16px; display: none; }
  .output-area pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; color: #aaa; max-height: 400px; overflow-y: auto; }
  .copy-btn { margin-top: 10px; padding: 8px 16px; background: #333; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  .instructions { background: #1e3a1e; border: 1px solid #22c55e44; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; font-size: 14px; color: #a3e6a3; }
</style>
</head>
<body>

<h1>Seletor de Capas dos Produtos</h1>
<div class="instructions">
  Clique na imagem que deseja como <strong>capa</strong> de cada produto. Depois clique em <strong>"Salvar Capas"</strong>.
</div>

<div id="products"></div>

<button class="save-btn" onclick="saveCovers()">Salvar Capas</button>

<div id="outputArea" class="output-area">
  <h3 style="margin-bottom:10px;">Ordem atualizada gerada. Cole no terminal quando solicitado:</h3>
  <pre id="outputText"></pre>
  <button class="copy-btn" onclick="copyOutput()">Copiar</button>
</div>

<script>
// Will be populated by fetching index.html and parsing productImagesByCode
let productImagesByCode = {};
let coverSelections = {}; // code -> index of selected cover

const NEW_CODES = [
  'EX022','EX023','EX025','EX026','EX027','EX028','EX029',
  'EX030','EX031','EX032','EX033','EX034','EX035',
  'EX036','EX037','EX039','EX040','EX041','EX042','EX043','EX044'
];

const PRODUCT_NAMES = {
  'EX022': 'Ombrelone Lateral Sunny Redondo',
  'EX023': 'Cadeira Geribá',
  'EX025': 'Mesa Garopaba Diâmetro 1,10',
  'EX026': 'Mesa Garopaba Diâmetro 1,50',
  'EX027': 'Cadeira Leblon com Braço em Polywood Teka',
  'EX028': 'Mesa Lateral Geribá',
  'EX029': 'Espreguiçadeira Estaleiro',
  'EX030': 'Espreguiçadeira Búzios Outras Cores',
  'EX031': 'Espreguiçadeira Malta',
  'EX032': 'Poltrona Malta',
  'EX033': 'Sofá Malta',
  'EX034': 'Conjunto Malta',
  'EX035': 'Ombrelone Lateral Sunny Quadrado',
  'EX036': 'Ombrelone Lateral Sunset Redondo',
  'EX037': 'Ombrelone Lateral Sunset Quadrado',
  'EX039': 'Poltrona Sunny',
  'EX040': 'Poltrona Dupla Sunny',
  'EX041': 'Chaise Sunny',
  'EX042': 'Puff Sunny',
  'EX043': 'Chaise Maresias',
  'EX044': 'Colchão Flutuante'
};

async function init() {
  const resp = await fetch('index.html');
  const html = await resp.text();

  // Extract productImagesByCode from the HTML
  const match = html.match(/const\s+productImagesByCode\s*=\s*(\{[\s\S]*?\});/);
  if (match) {
    try {
      productImagesByCode = JSON.parse(match[1]);
    } catch(e) {
      // Try eval as fallback (the JSON might have trailing commas)
      try {
        productImagesByCode = (new Function('return ' + match[1]))();
      } catch(e2) {
        alert('Erro ao parsear productImagesByCode: ' + e2.message);
        return;
      }
    }
  }

  const container = document.getElementById('products');

  for (const code of NEW_CODES) {
    const images = productImagesByCode[code];
    if (!images || !images.length) continue;

    coverSelections[code] = 0; // default: first image is cover

    const div = document.createElement('div');
    div.className = 'product';
    div.id = 'product-' + code;

    const header = document.createElement('div');
    header.className = 'product-header';
    header.innerHTML = `<h2>${PRODUCT_NAMES[code] || code}</h2><span class="code">${code} — ${images.length} foto(s)</span>`;
    div.appendChild(header);

    const imagesDiv = document.createElement('div');
    imagesDiv.className = 'images';

    images.forEach((img, idx) => {
      const card = document.createElement('div');
      card.className = 'img-card' + (idx === 0 ? ' selected' : '');
      card.dataset.code = code;
      card.dataset.idx = idx;

      const imgEl = document.createElement('img');
      imgEl.src = img.desktop;
      imgEl.loading = 'lazy';
      imgEl.alt = `${code} foto ${idx + 1}`;
      card.appendChild(imgEl);

      card.addEventListener('click', () => selectCover(code, idx));
      imagesDiv.appendChild(card);
    });

    div.appendChild(imagesDiv);
    container.appendChild(div);
  }
}

function selectCover(code, idx) {
  coverSelections[code] = idx;
  const product = document.getElementById('product-' + code);
  product.querySelectorAll('.img-card').forEach((card, i) => {
    card.classList.toggle('selected', i === idx);
  });
}

function saveCovers() {
  // Build reordered data
  const result = {};
  for (const code of NEW_CODES) {
    const images = productImagesByCode[code];
    if (!images || !images.length) continue;

    const selectedIdx = coverSelections[code] || 0;
    if (selectedIdx === 0) {
      result[code] = images; // no change needed
    } else {
      // Move selected to first position
      const reordered = [images[selectedIdx], ...images.filter((_, i) => i !== selectedIdx)];
      result[code] = reordered;
    }
  }

  // Output as JSON
  const output = JSON.stringify(result, null, 2);
  document.getElementById('outputText').textContent = output;
  document.getElementById('outputArea').style.display = 'block';

  // Also save to localStorage for the Python script to read
  localStorage.setItem('coverSelections', JSON.stringify(coverSelections));

  // Send to server
  fetch('/save-covers', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: output
  }).then(r => r.text()).then(msg => {
    alert('Capas salvas com sucesso! ' + msg);
  }).catch(() => {
    alert('Capas geradas! Copie o JSON acima se necessário.');
  });
}

function copyOutput() {
  const text = document.getElementById('outputText').textContent;
  navigator.clipboard.writeText(text);
}

init();
</script>
</body>
</html>
