<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Varandamix Special Summer Sale Banner</title>
  <style>
    :root {
      --banner-bg: url('assets/Sala de estar moderna e sofisticada.png');
      --banner-text: #1b1b1b;
      --banner-accent: #b58a37;
      --banner-shadow: 0 28px 80px rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Gloock", "Playfair Display", Georgia, serif;
      background: #f2f2f2;
      display: grid;
      place-items: center;
    }

    .sale-banner-float {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 9999;
      pointer-events: none;
    }

    .sale-banner {
      pointer-events: auto;
      position: relative;
      width: min(920px, 92vw);
      padding: 48px 48px 42px;
      border-radius: 28px;
      text-decoration: none;
      color: var(--banner-text);
      overflow: hidden;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: var(--banner-shadow);
      border: 1px solid rgba(255, 255, 255, 0.8);
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .sale-banner:hover {
      transform: translateY(-4px);
      box-shadow: 0 32px 90px rgba(0, 0, 0, 0.3);
    }

    .sale-banner::before {
      content: "";
      position: absolute;
      inset: -25px;
      background-image: var(--banner-bg);
      background-size: cover;
      background-position: center;
      filter: blur(8px);
      transform: scale(1.08);
      opacity: 0.9;
      z-index: 0;
    }

    .sale-banner::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(130deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.6));
      z-index: 1;
    }

    .sale-banner-content {
      position: relative;
      z-index: 2;
      text-align: center;
      display: grid;
      gap: 16px;
      justify-items: center;
    }

    .sale-banner-brand {
      font-family: "Urbanist", "Montserrat", sans-serif;
      font-size: 13px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(27, 27, 27, 0.65);
    }

    .sale-banner-title {
      font-size: clamp(34px, 5vw, 56px);
      font-weight: 600;
      margin: 0;
      text-transform: uppercase;
    }

    .sale-banner-copy {
      font-family: "Urbanist", "Montserrat", sans-serif;
      font-size: clamp(16px, 2.2vw, 20px);
      max-width: 560px;
      margin: 0;
      color: rgba(27, 27, 27, 0.85);
    }

    .sale-banner-cta {
      font-family: "Urbanist", "Montserrat", sans-serif;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 22px;
      border-radius: 999px;
      background: var(--banner-accent);
      color: #fff;
      letter-spacing: 0.02em;
      box-shadow: 0 12px 30px rgba(181, 138, 55, 0.35);
    }

    @media (max-width: 600px) {
      .sale-banner {
        padding: 36px 28px 30px;
        border-radius: 22px;
      }

      .sale-banner-brand {
        letter-spacing: 0.2em;
      }
    }
  </style>
</head>
<body>
  <div class="sale-banner-float">
    <a class="sale-banner" href="https://sale.varandamix.com" target="_blank" rel="noopener">
      <div class="sale-banner-content">
        <div class="sale-banner-brand">Varandamix In Out</div>
        <h1 class="sale-banner-title">Special Summer Sale</h1>
        <div class="sale-banner-cta">Acesso VIP · Clique aqui</div>
        <p class="sale-banner-copy">Peças do nosso acervo com até 60% OFF.</p>
      </div>
    </a>
  </div>
</body>
</html>
