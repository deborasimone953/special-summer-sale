<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Special Summer Sale - Acesso VIP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0b0b0b; color: #fff; }
    .hero {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      background:
        linear-gradient(180deg, rgba(0,0,0,.75), rgba(0,0,0,.65)),
        url('assets/Sala de estar moderna e sofisticada.png') center/cover no-repeat;
    }
    .card-access {
      width: 100%;
      max-width: 560px;
      background: rgba(20, 20, 20, 0.75);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      backdrop-filter: blur(6px);
    }
    .subtle { color: rgba(255,255,255,.75); }
    .badge-vip { background: rgba(184,155,94,.18); color: #e2c37a; border: 1px solid rgba(184,155,94,.35); }
  </style>
</head>
<body>
  <main class="hero">
    <div class="card-access p-4 p-md-5">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
        <h1 class="h4 m-0 fw-semibold">Special Summer Sale</h1>
        <span class="badge rounded-pill badge-vip px-3 py-2">Acesso VIP</span>
      </div>

      <p class="mt-3 mb-4 subtle">
        Produtos selecionados com descontos especiais.
        Para acessar, peça a senha no WhatsApp.
      </p>

      <div class="d-grid gap-2 mb-4">
        <a id="whatsLink" class="btn btn-success btn-lg" target="_blank" rel="noopener">Pedir senha no WhatsApp</a>
      </div>

      <div class="mb-2">
        <label for="password" class="form-label">Digite a senha</label>
        <input id="password" type="password" class="form-control form-control-lg" placeholder="" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false" readonly>
      </div>

      <div class="d-grid gap-2">
        <button id="enterBtn" class="btn btn-light btn-lg">Entrar</button>
      </div>

      <div id="error" class="mt-3 small" style="display:none; color:#ffb4b4;"></div>
    </div>
  </main>

  <script>
    const AUTH_KEY = 'summerSaleAuth';
    const AUTH_VALUE = '1';
    const PASSWORD = 'vip-acess';
    const WHATSAPP_NUMBER = '5551999594767';

    function normalize(text) {
      return String(text || '').trim().toLowerCase();
    }

    function baseUrl() {
      const clean = window.location.href.split('#')[0].split('?')[0];
      if (clean.endsWith('acesso.html')) {
        return clean.slice(0, -'acesso.html'.length);
      }
      if (clean.endsWith('/')) return clean;
      return clean + '/';
    }

    function indexUrl() {
      return baseUrl() + 'index.html';
    }

    function setAuthorized() {
      localStorage.setItem(AUTH_KEY, AUTH_VALUE);
    }

    function isAuthorized() {
      return localStorage.getItem(AUTH_KEY) === AUTH_VALUE;
    }

    if (isAuthorized()) {
      window.location.replace(indexUrl());
    }

    const whatsLink = document.getElementById('whatsLink');
    const msg = 'Quero acessar a Special Summer Sale. Pode me enviar a senha VIP?';
    whatsLink.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;

    const passwordInput = document.getElementById('password');
    const enterBtn = document.getElementById('enterBtn');
    const errorEl = document.getElementById('error');

    passwordInput.value = '';
    passwordInput.addEventListener('focus', () => {
      passwordInput.removeAttribute('readonly');
      passwordInput.value = '';
    }, { once: true });

    function showError(text) {
      errorEl.textContent = text;
      errorEl.style.display = 'block';
    }

    function tryEnter() {
      const attempt = normalize(passwordInput.value);
      if (!attempt) {
        showError('Digite a senha para entrar.');
        return;
      }
      if (attempt !== PASSWORD) {
        showError('Senha incorreta. Clique em “Pedir senha no WhatsApp”.');
        return;
      }
      setAuthorized();
      window.location.href = indexUrl();
    }

    enterBtn.addEventListener('click', tryEnter);
    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        tryEnter();
      }
    });
  </script>
</body>
</html>
